<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Karla:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F5EFE4;
    font-family: 'Karla', sans-serif;
    color: #45403A;
    position: relative;
  }
  /* topo-echo, faint concentric rings bottom-right */
  .rings { position: absolute; right: -160px; bottom: -220px; width: 720px; height: 720px; }
  .rings circle { fill: none; stroke: #4B5D45; }
  .frame { position: absolute; inset: 34px; border: 1px solid #E3DAC8; border-radius: 18px; }
  .content { position: absolute; left: 92px; top: 150px; right: 92px; }
  .mark { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .mark svg { width: 40px; height: 40px; }
  .mark span {
    font-weight: 700; font-size: 20px; letter-spacing: .18em; text-transform: uppercase; color: #8C8676;
  }
  h1 {
    font-family: 'Domine', Georgia, serif; font-weight: 700; font-size: 104px; line-height: 1.02;
    color: #2B2820; letter-spacing: -0.01em;
  }
  .role {
    margin-top: 22px; font-weight: 700; font-size: 26px; letter-spacing: .16em;
    text-transform: uppercase; color: #4B5D45;
  }
  .rule { margin: 30px 0 26px; width: 96px; height: 4px; background: #B85C3C; border-radius: 2px; }
  .line { font-size: 30px; line-height: 1.4; color: #6A6459; max-width: 760px; }
  .url {
    position: absolute; left: 92px; bottom: 66px;
    font-weight: 700; font-size: 24px; letter-spacing: .04em; color: #4B5D45;
  }
</style>
</head>
<body>
  <svg class="rings" viewBox="0 0 720 720" aria-hidden="true">
    <circle cx="360" cy="360" r="330" stroke-width="1.5" opacity="0.18"/>
    <circle cx="360" cy="360" r="250" stroke-width="1.5" opacity="0.24"/>
    <circle cx="360" cy="360" r="170" stroke-width="1.5" opacity="0.3"/>
    <circle cx="360" cy="360" r="92"  stroke-width="1.5" opacity="0.4" stroke="#B85C3C"/>
    <circle cx="360" cy="360" r="10" fill="#B85C3C" stroke="none"/>
  </svg>
  <div class="frame"></div>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#4B5D45" stroke-width="2"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#4B5D45" stroke-width="2"/><circle cx="16" cy="16" r="3.4" fill="#B85C3C"/></svg>
      <span>Portfolio</span>
    </div>
    <h1>Dan Jecan</h1>
    <div class="role">Senior UX Researcher</div>
    <div class="rule"></div>
    <div class="line">Over 15 years helping teams decide what to build.</div>
  </div>
  <div class="url">danjecan.com&nbsp;&nbsp;·&nbsp;&nbsp;See the work</div>
</body>
</html>
