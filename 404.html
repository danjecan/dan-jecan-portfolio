<style>
  :root {
    --bg: #F5EFE4;
    --surface: #FFFFFF;
    --feature: #EAE3D2;
    --ink: #2B2820;
    --text: #45403A;
    --text-soft: #6A6459;
    --muted: #8C8676;
    --accent: #4B5D45;
    --accent-dk: #3C4B38;
    --rust: #B85C3C;
    --rule: #E3DAC8;
    --rule-soft: #ECE4D4;
    --radius: 16px;
    --radius-sm: 12px;
    --pill: 999px;
    --shadow: 0 1px 2px rgba(43,40,32,.04), 0 12px 32px rgba(43,40,32,.06);
    --pad-x: clamp(20px, 5vw, 40px);
    --gap-section: clamp(44px, 7vw, 64px);
    --w-page: 1160px;   /* nav, footer, wide layouts */
    --w-col: 52rem;     /* reading column inside .container-narrow */
    --w-read: 44rem;    /* body prose */
    --w-lede: 38rem;    /* leads, intros, section subheads */
    --w-card: 30rem;    /* the contact form card */
  }

  * { box-sizing: border-box; }
  html { overflow-y: scroll; }
  body {
    margin: 0;
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    font-size: 16px; line-height: 1.65;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  img, svg { display: block; }
  .display { font-family: 'Domine', Georgia, 'Times New Roman', serif; }
  h1, h2, h3 { color: var(--ink); font-weight: 700; line-height: 1.18; margin: 0; }
  p { margin: 0 0 1.1em; }

  .page { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
  main { position: relative; z-index: 2; flex: 1; }
  .container { max-width: var(--w-page); margin-inline: auto; padding-inline: var(--pad-x); width: 100%; }
  .container-narrow { max-width: var(--w-page); margin-inline: auto; padding-inline: var(--pad-x); width: 100%; }
  .container-narrow > * { max-width: var(--w-col); }

  .topo-bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  /* the "lantern" — the topo map is fog by default; the cursor is the headlamp
     that reveals the ground you're looking at ("mapping the unknown"). A faint
     ambient floor keeps the whole map just-visible so the page reads with no mouse. */
  .scrim { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .96;
    background: radial-gradient(circle 300px at var(--mx, 72%) var(--my, 32%),
      rgba(245,239,228,0.03) 0%, rgba(245,239,228,0.30) 32%, rgba(245,239,228,0.90) 74%); }
  .lamp { position: fixed; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle 270px at var(--mx, 72%) var(--my, 32%),
      rgba(255,238,205,0.62) 0%, rgba(255,238,205,0.16) 44%, rgba(255,238,205,0) 70%); }
  @media (prefers-reduced-motion: reduce) {
    .scrim { background: radial-gradient(circle 360px at 72% 30%,
      rgba(245,239,228,0.10) 0%, rgba(245,239,228,0.88) 66%); }
    .lamp { display: none; }
  }
  @media (hover: none), (pointer: coarse) {
    .scrim { background: rgba(245,239,228,0.82); opacity: 1; }
    .lamp { display: none; }
  }
  .pin-dot { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { r: 4px; opacity: .5; } 100% { r: 17px; opacity: 0; } }

  .nav-wrap { position: relative; z-index: 3; padding-top: 24px; }
  .nav-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px;
    background: var(--surface); border-radius: var(--pill);
    padding: 12px 14px 12px 24px; box-shadow: 0 4px 18px rgba(43,40,32,.07); }
  .nav-name { font-size: 1.125rem; font-weight: 700; color: var(--ink); }
  .nav-links { display: flex; align-items: center; gap: clamp(14px, 3vw, 26px); }
  .nav-links a { font-size: .9rem; font-weight: 600; color: var(--text-soft); }
  .nav-links a:hover { color: var(--accent); }
  .nav-link.active, .nav-links a[aria-current="page"] { color: var(--ink); }
  .nav-links a.nav-cta { background: var(--accent); color: var(--bg); padding: 9px 18px;
    border-radius: var(--pill); font-weight: 700; white-space: nowrap; }
  .nav-links a.nav-cta:hover { background: var(--accent-dk); color: var(--bg); }
  .nav-links a.nav-cta.active, .nav-links a.nav-cta[aria-current="page"] { color: var(--bg); }

  .eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 16px; }
  .lead { font-size: 1.15rem; line-height: 1.6; color: var(--text-soft); max-width: var(--w-lede); margin: 0 0 28px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 700 .95rem/1 'Karla', ui-sans-serif, sans-serif; padding: 13px 22px;
    border-radius: var(--pill); border: 1.5px solid transparent; cursor: pointer; text-align: center; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-dk); }
  .btn-ghost { background: transparent; border-color: var(--rule); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-rust { background: var(--rust); color: #FFF8ED; }
  .btn-rust:hover { filter: brightness(.94); }
  .btn-block { display: flex; width: 100%; }

  .tag { display: inline-block; background: var(--surface); border: 1.5px solid var(--rule);
    border-radius: var(--pill); padding: 7px 16px; font-size: .9rem; font-weight: 600; color: var(--text); }
  a.tag:hover { border-color: var(--accent); color: var(--accent); }

  /* interactive-only cursor: a small compass, echoing the map motif. Prefixed
     with .page so it beats components that set their own cursor (.case-row, .cs-tab). */
  @media (hover: hover) and (pointer: fine) {
    .page a[href], .page button, .page [role="button"], .page label[for],
    .page summary, .page .btn, .page .case-row, .page .cs-tab {
      cursor: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='30'%20height='30'%3E%3Ccircle%20cx='15'%20cy='15'%20r='11'%20fill='none'%20stroke='%23F5EFE4'%20stroke-width='3.6'/%3E%3Ccircle%20cx='15'%20cy='15'%20r='11'%20fill='none'%20stroke='%232B2820'%20stroke-width='1.6'/%3E%3Cpath%20d='M15%204%20L18.4%2015.6%20L15%2013%20L11.6%2015.6%20Z'%20fill='%23B85C3C'/%3E%3Cpath%20d='M15%2026%20L11.6%2014.4%20L15%2017%20L18.4%2014.4%20Z'%20fill='%232B2820'/%3E%3Ccircle%20cx='15'%20cy='15'%20r='1.9'%20fill='%23F5EFE4'%20stroke='%232B2820'%20stroke-width='1.1'/%3E%3C/svg%3E") 15 15, pointer;
    }
    .page button:disabled { cursor: not-allowed; }
  }

  .footer-wrap { position: relative; z-index: 2; border-top: 1px solid var(--rule);
    margin-top: var(--gap-section); background: var(--bg); }
  .footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 16px; padding-block: 26px; }
  .footer-links { display: flex; gap: 22px; flex-wrap: wrap; }
  .footer-links a { font-size: .9rem; font-weight: 600; color: var(--text-soft); }
  .footer-links a:hover { color: var(--accent); }
  .footer-note { font-size: .85rem; color: var(--muted); }

  @media (max-width: 640px) {
    .nav-wrap { padding-top: 14px; }
    .nav-bar { padding: 9px 10px 9px 14px; gap: 8px; border-radius: 22px; }
    .nav-name { font-size: .95rem; white-space: nowrap; }
    .nav-links { gap: 10px; }
    .nav-links a { font-size: .78rem; }
    .nav-links a.nav-cta { padding: 8px 12px; }
    .lead { font-size: 1.02rem; }
    .footer-inner { padding-block: 22px; }
  }
  @media (max-width: 380px) {
    .nav-bar { padding: 8px 8px 8px 12px; gap: 7px; }
    .nav-links { gap: 8px; }
    .nav-links a { font-size: .74rem; }
  }

  /* ---- contact ---- */
  .contact-wrap { padding: clamp(52px, 9vw, 92px) 0 0; }
  .contact-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(32px, 5vw, 64px); align-items: start; }
  .h1-hero { font-size: clamp(2rem, 1.4rem + 3vw, 2.9rem); line-height: 1.12; margin: 0 0 18px; }
  .contact-p1 { font-size: 1.15rem; line-height: 1.6; color: var(--text-soft); margin: 0 0 14px; }
  .contact-p2 { font-size: 1rem; line-height: 1.6; color: var(--text-soft); margin: 0; max-width: var(--w-lede); }
  .contact-p2 a { color: var(--rust); font-weight: 700; border-bottom: 1px solid rgba(184,92,60,.4); }

  .form-card { background: var(--surface); border-radius: var(--radius); padding: clamp(24px, 4vw, 34px);
    box-shadow: var(--shadow); }
  .form-greeting { font-size: 1.05rem; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .contact-lead { font-size: .95rem; line-height: 1.6; color: var(--text-soft); margin: 0 0 20px; }
  .contact-elsewhere { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 24px 0 12px; }
  .social-row { display: flex; gap: 10px; flex-wrap: wrap; }

  @media (max-width: 720px) {
    .contact-grid { grid-template-columns: 1fr; gap: 32px; }
    .form-card { max-width: var(--w-card); }
  }
</style>
</head>

<script>
  var topoLayer = document.getElementById('topoLayer');
  var root = document.documentElement;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var smallScreen = window.matchMedia('(max-width: 640px)').matches;

  // the lantern — a light pool that follows the cursor and reveals the terrain
  if (finePointer && !reduceMotion) {
    var lampX = 72, lampY = 32, curX = 72, curY = 32;
    window.addEventListener('mousemove', function (e) {
      curX = (e.clientX / window.innerWidth) * 100;
      curY = (e.clientY / window.innerHeight) * 100;
    });
    (function lamp() {
      lampX += (curX - lampX) * 0.16;
      lampY += (curY - lampY) * 0.16;
      root.style.setProperty('--mx', lampX.toFixed(2) + '%');
      root.style.setProperty('--my', lampY.toFixed(2) + '%');
      requestAnimationFrame(lamp);
    })();
  }

  // pointer parallax on the terrain (slower than the light, for a little depth)
  if (topoLayer && !smallScreen && !reduceMotion) {
    var targetX = 0, targetY = 0, sx = 0, sy = 0;
    window.addEventListener('mousemove', function (e) {
      targetX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    (function tick() {
      sx += (targetX - sx) * 0.06;
      sy += (targetY - sy) * 0.06;
      topoLayer.style.transform = 'translate(' + (sx * 42).toFixed(1) + 'px, ' + (sy * 42).toFixed(1) + 'px)';
      requestAnimationFrame(tick);
    })();
  }
</script>
